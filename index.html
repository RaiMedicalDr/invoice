<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOGIN</title>
  <style>
    body {
      background-color: #000;
      color: #00ff00;
      font-family: 'Courier New', monospace;
      font-size: 1.2rem;
      padding: 2rem;
    }

    #console {
      white-space: pre-wrap;
    }

    input {
      background: transparent;
      border: none;
      color: #00ff00;
      font-family: 'Courier New', monospace;
      font-size: 1.2rem;
      outline: none;
      caret-color: #00ff00;
    }

    input[type="password"] {
      -webkit-text-security: disc;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div id="console">
    <div id="line1">LOGIN ID: <input type="text" id="userid" autofocus /></div>
    <div id="line2" class="hidden">PASSWORD: <input type="password" id="password" /></div>
    <div id="line3" class="hidden">ログイン確認中...</div>
    <div id="error" style="color: red;"></div>
  </div>

  <script>
    const ADMIN_ID = "admin";
    const ADMIN_PASS = "pass3734771A";

    const idInput = document.getElementById('userid');
    const passInput = document.getElementById('password');
    const line2 = document.getElementById('line2');
    const line3 = document.getElementById('line3');
    const errorMsg = document.getElementById('error');

    idInput.addEventListener('keydown', function (e) {
      if (e.key === "Enter") {
        if (idInput.value.trim() === "") return;
        line2.classList.remove("hidden");
        passInput.focus();
      }
    });

    passInput.addEventListener('keydown', function (e) {
      if (e.key === "Enter") {
        const id = idInput.value.trim();
        const pass = passInput.value;

        line3.classList.remove("hidden");

        setTimeout(() => {
          if (id === ADMIN_ID && pass === ADMIN_PASS) {
            window.location.href = "home.html";
          } else {
            errorMsg.textContent = "アクセス拒否：IDまたはパスワードが間違っています。";
          }
        }, 1000);
      }
    });
  </script>
</body>
</html>
