<!DOCTYPE html>
<html lang="ja">
<head>
    <!-- PWA Manifest -->
<link rel="manifest" href="manifest.json">

<!-- iOS Safari用 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="請求書アプリ">
<link rel="apple-touch-icon" href="請求書.png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>レジ風 請求書アプリ</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <!-- 左：A4領収書プレビュー -->
    <div class="receipt-a4" id="receipt-preview">
        <div class="header">
          <h2>領収書</h2>
          <p>発行日：<span id="issued-date"></span></p>
          <p>発行元：Hikonezumi Tech Store</p>
        </div>
      
        <div class="customer">
          <p>御中：お客様各位</p>
        </div>
      
        <div class="amount-box">
          <p>金額：<strong>¥<span id="receipt-total">0</span></strong>（税込）</p>
        </div>
      
        <div class="details">
          <table>
            <thead>
              <tr><th>品目</th><th>金額</th></tr>
            </thead>
            <tbody id="receipt-list">
              <!-- JSで生成 -->
            </tbody>
          </table>
        </div>
      
        <div class="footer">
          <p>上記の通り、正に領収いたしました。</p>
          <div class="stamp">★印★</div>
        </div>
      </div>

    <!-- 右：電卓UI -->
    <div class="app">
      <h1>請求入力</h1>

      <div class="item-buttons">
        <button onclick="selectItem('生活費')">生活費</button>
        <button onclick="selectItem('商品')">商品</button>
        <button onclick="selectItem('マネー')">マネー</button>
        <button onclick="selectItem('その他')">その他</button>
      </div>

      <div class="display">
        <span id="selected-item">未選択</span>：
        ¥<span id="input-amount">0</span>
      </div>

      <div class="numpad">
        <button onclick="appendNumber(1)">1</button>
        <button onclick="appendNumber(2)">2</button>
        <button onclick="appendNumber(3)">3</button>
        <button onclick="appendNumber(4)">4</button>
        <button onclick="appendNumber(5)">5</button>
        <button onclick="appendNumber(6)">6</button>
        <button onclick="appendNumber(7)">7</button>
        <button onclick="appendNumber(8)">8</button>
        <button onclick="appendNumber(9)">9</button>
        <button onclick="clearAmount()">C</button>
        <button onclick="appendNumber(0)">0</button>
        <button onclick="confirmItem()">OK</button>
      </div>

      <button id="generate-pdf">PDFで印刷</button>
    </div>
  </div>

  

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
