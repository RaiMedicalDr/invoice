<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>設定 | 請求書アプリ</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      background: linear-gradient(to bottom right, #cfeeff, #e6faff);
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 2rem;
    }
    .settings-container {
      max-width: 600px;
      margin: auto;
      background: rgba(255, 255, 255, 0.9);
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0, 170, 255, 0.3);
    }
    h1 {
      text-align: center;
      color: #0077aa;
    }
    label {
      display: block;
      margin: 1.5rem 0 0.5rem;
      font-weight: bold;
      color: #005577;
    }
    select, input[type="checkbox"] {
      font-size: 1rem;
      padding: 0.5rem;
      width: 100%;
      border-radius: 6px;
      border: 1px solid #00aaff;
      background: #f0faff;
    }
    .btn-logout {
      margin-top: 2rem;
      width: 100%;
      padding: 1rem;
      font-size: 1.2rem;
      background: linear-gradient(to bottom, #00ccff, #0099cc);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="settings-container">
    <h1>設定</h1>

    <label for="theme">テーマ選択</label>
    <select id="theme">
      <option value="light">ライトモード</option>
      <option value="dark">ダークモード</option>
      <option value="aero">Aero（青）</option>
    </select>

    <label>
      <input type="checkbox" id="sound-toggle" /> 効果音を有効にする
    </label>

    <label>
      <input type="checkbox" id="save-login" /> ログイン情報を保存する
    </label>

    <button class="btn-logout" onclick="logout()">ログアウト</button>
  </div>

  <script>
    function logout() {
      alert("ログアウトしました");
      location.href = "index.html";
    }
  </script>
</body>
</html>
